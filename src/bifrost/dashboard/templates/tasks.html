{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<h1>Task Board</h1>
<div role="group">
  <button hx-get="/tasks/list" hx-target="#task-list" hx-swap="innerHTML">All</button>
  <button hx-get="/tasks/list?status=queued" hx-target="#task-list" hx-swap="innerHTML">Queued</button>
  <button hx-get="/tasks/list?status=running" hx-target="#task-list" hx-swap="innerHTML">Running</button>
  <button hx-get="/tasks/list?status=completed" hx-target="#task-list" hx-swap="innerHTML">Completed</button>
  <button hx-get="/tasks/list?status=failed" hx-target="#task-list" hx-swap="innerHTML">Failed</button>
  <button hx-get="/tasks/list?status=canceled" hx-target="#task-list" hx-swap="innerHTML">Canceled</button>
  <button hx-get="/tasks/list?status=rejected" hx-target="#task-list" hx-swap="innerHTML">Rejected</button>
</div>
<div id="task-list"
     hx-get="/tasks/list"
     hx-trigger="load, every 10s"
     hx-swap="innerHTML">
  Loading...
</div>
{% endblock %}
