{% if tasks %}
<table>
  <thead>
    <tr><th>ID</th><th>Status</th><th>Requester</th><th>Assignee</th><th>Updated</th></tr>
  </thead>
  <tbody>
    {% for t in tasks %}
    <tr>
      <td>{{ t.id[:8] }}</td>
      <td><span class="badge badge-{{ t.status }}">{{ t.status }}</span></td>
      <td>{{ agent_names.get(t.requester, t.requester[:8]) }}</td>
      <td>{{ agent_names.get(t.assignee, t.assignee[:8]) }}</td>
      <td>{{ t.updated_at|fmt_time }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No tasks.</p>
{% endif %}
