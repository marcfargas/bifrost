{% if events %}
{% for event in events %}
<article>
  <header>
    <small>{{ event.timestamp | fmt_time }}</small>
    <span class="badge">{{ event.type }}</span>
    <strong>{{ agent_names.get(event.from_agent, event.from_agent[:8]) }}</strong>
  </header>
  <p>{{ event.data | fmt_event(event.type) }}</p>
</article>
{% endfor %}
{% else %}
<p>No activity yet.</p>
{% endif %}
