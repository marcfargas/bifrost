{% if events %}
<ul>
  {% for e in events %}
  <li>
    <strong>{{ agent_names.get(e.from_agent, e.from_agent[:8]) }}</strong>
    <small>{{ e.timestamp|fmt_time }}</small>
    <span>{{ e.type }}: {{ e.data|fmt_event(e.type) }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No recent activity.</p>
{% endif %}
