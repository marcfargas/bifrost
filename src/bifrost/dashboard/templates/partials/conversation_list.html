{% if conversations %}
{% for conv in conversations %}
<article class="conv-item"
         hx-get="/conversations/{{ conv.id }}/messages"
         hx-target="#conv-detail"
         hx-swap="innerHTML">
  <strong>{{ conv.title or conv.id[:12] }}</strong>
  {% if conv.channel %}<br><small>{{ conv.channel }}</small>{% endif %}
  <br><small>{{ conv.created_at | fmt_time }}</small>
</article>
{% endfor %}
{% else %}
<p>No conversations.</p>
{% endif %}
