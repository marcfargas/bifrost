<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bifrost — {% block title %}Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
          integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
          crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50">
  <nav class="fixed top-0 left-0 w-56 h-full bg-gray-900 text-white p-6 overflow-y-auto">
    <h2 class="text-xl font-bold mb-6">Bifrost</h2>
    <ul class="space-y-1">
      <li>
        <a href="/agents"
           class="block px-3 py-2 rounded text-sm {% if active == 'agents' %}bg-gray-700{% endif %} hover:bg-gray-700 transition-colors"
           {% if active == 'agents' %}aria-current="page"{% endif %}>Agents</a>
      </li>
      <li>
        <a href="/tasks"
           class="block px-3 py-2 rounded text-sm {% if active == 'tasks' %}bg-gray-700{% endif %} hover:bg-gray-700 transition-colors"
           {% if active == 'tasks' %}aria-current="page"{% endif %}>Tasks</a>
      </li>
      <li>
        <a href="/conversations"
           class="block px-3 py-2 rounded text-sm {% if active == 'conversations' %}bg-gray-700{% endif %} hover:bg-gray-700 transition-colors"
           {% if active == 'conversations' %}aria-current="page"{% endif %}>Conversations</a>
      </li>
      <li>
        <a href="/activity"
           class="block px-3 py-2 rounded text-sm {% if active == 'activity' %}bg-gray-700{% endif %} hover:bg-gray-700 transition-colors"
           {% if active == 'activity' %}aria-current="page"{% endif %}>Activity</a>
      </li>
    </ul>
  </nav>
  <main class="ml-56 min-h-screen p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
