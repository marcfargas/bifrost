{% extends "base.html" %}
{% block title %}Conversations{% endblock %}
{% block content %}
<h1>Conversations</h1>
<div class="conv-grid">
  <div id="conv-list"
       hx-get="/conversations/list"
       hx-trigger="load, every 10s"
       hx-swap="innerHTML">
    Loading...
  </div>
  <div id="conv-detail">
    <p>Select a conversation to view messages.</p>
  </div>
</div>
{% endblock %}
