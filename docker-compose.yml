services:
  bifrost:
    build: .
    command:
      [
        "python",
        "-m",
        "bifrost",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - SERVER_URL=${SERVER_URL:-}
    volumes:
      - data:/app/data
    ports:
      - "8000:8000"

volumes:
  data:
