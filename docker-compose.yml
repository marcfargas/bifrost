services:
  bifrost-spike:
    build: .
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "bifrost.spike_oauth:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - SERVER_URL=${SERVER_URL:-}
    ports:
      - "8000:8000"
