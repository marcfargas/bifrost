name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Build, lint, unit tests, race detector — all platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Lint (vet)
        if: runner.os == 'Linux'
        run: go vet ./...

      - name: Lint (gofmt)
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit + integration tests
        run: go test ./... -count=1 -timeout 120s

      - name: Race detector
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1 -timeout 120s

      - name: Plugin verification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go build -o bifrost ./cmd/bifrost
          ./bifrost version
          # Verify shim responds to MCP initialize
          INIT='{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}'
          output=$(printf '%s\n' "$INIT" | { cat; sleep 2; } | timeout 5 ./bifrost shim 2>/dev/null || true)
          if echo "$output" | grep -q '"serverInfo"'; then
            echo "Shim MCP: OK"
          else
            echo "FAIL: shim did not respond to initialize"
            exit 1
          fi
          # Verify plugin files
          jq -e '.name == "bifrost"' plugin/.claude-plugin/plugin.json > /dev/null
          echo "plugin.json: OK"
          jq -e '.mcpServers.bifrost.command' plugin/.mcp.json > /dev/null
          echo ".mcp.json: OK"

  # 2. Claude E2E — real claude -p with bifrost MCP tools (needs API key)
  claude-e2e:
    name: Claude E2E
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bifrost
        run: |
          go build -o bifrost ./cmd/bifrost
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install Claude Code
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: "E2E: whoami"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_WhoAmI

      - name: "E2E: list agents"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_ListAgents

      - name: "E2E: send message"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_SendMessage

      - name: "E2E: create task"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_CreateAndListTask

      - name: "E2E: two-agent conversation"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_TwoAgentConversation

      - name: "E2E: channel push (skipped — platform limitation)"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudeMCP_ChannelPush

      - name: "E2E: plugin mode (skipped — needs investigation)"
        if: env.ANTHROPIC_AUTH_TOKEN != ''
        run: go test -tags e2e ./test/e2e/ -v -timeout 120s -run TestClaudePlugin_WhoAmI
